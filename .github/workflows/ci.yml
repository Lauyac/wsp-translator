name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure SDK components
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -d "$ANDROID_HOME/build-tools/34.0.0" ] || yes | "$SM" "build-tools;34.0.0" >/dev/null
          [ -d "$ANDROID_HOME/platforms/android-34" ] || yes | "$SM" "platforms;android-34" >/dev/null

      # 注意：ANDROID_HOME 是 Runner 系统环境变量，不能通过 ${{ env.ANDROID_HOME }}
      # 引用（env 上下文只含工作流显式定义的变量，会展开成空串）；改由 shell 展开。
      - name: Build APK
        run: WSP_SDK="$ANDROID_HOME" bash build.sh

      - name: Generate release manifests
        run: bash release.sh
        env:
          WSP_SKIP_SIG: '1'  # CI 仅验证构建与清单一致性，不持有签名私钥，产物不对外发布

      - name: Verify SHA-256 manifest matches APK
        run: |
          expected=$(cut -d' ' -f1 SHA256SUMS.txt)
          actual=$(sha256sum wsp-translator-*.apk | cut -d' ' -f1)
          echo "expected=$expected actual=$actual"
          [ "$expected" = "$actual" ] || { echo "SHA-256 不一致"; exit 1; }
          jq -e --arg s "$expected" '.sha256 == $s' update.json >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            *.apk
            update.json
            SHA256SUMS.txt
          if-no-files-found: error
